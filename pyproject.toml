[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd"
version = "0.1.0"
description = "A minimal scalar-valued autograd engine built from scratch — day by day."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VanshAt", email = "vanshdambhare09@gmail.com" }]
keywords = ["autograd", "deep-learning", "neural-network", "backpropagation", "education"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["micrograd*"]
